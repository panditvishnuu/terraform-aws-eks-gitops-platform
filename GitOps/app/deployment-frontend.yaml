apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-client
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-client
  template:
    metadata:
      labels:
        app: relay-client
    spec:
      containers:
        - name: relay-client
          image: 240783391682.dkr.ecr.ap-south-1.amazonaws.com/cloudforge/cloudforge-ecr:client-26a71bc45edfcc6a2ba685e04444568b106e61f1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
